name: Build and Validate Studix

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: Studix
  PROJECT: Studix.xcodeproj

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Prepare asset catalogs
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          [ -f Sources/Assets.xcassets/Contents.json ] || printf '{"info":{"author":"xcode","version":1}}\n' > Sources/Assets.xcassets/Contents.json
          [ -f Sources/Assets.xcassets/AppIcon.appiconset/Contents.json ] || printf '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}\n' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f Sources/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Prepare localized resources
        run: |
          mkdir -p Sources/ar.lproj
          if [ -f Sources/en.lproj/Localizable.strings ]; then
            sed -E 's/^("[^"]*") = .*$/\1 = \1;/' Sources/en.lproj/Localizable.strings > Sources/ar.lproj/Localizable.strings
          fi
          [ -f Sources/Assets.xcassets/Contents.json ]

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build for iOS device
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Studix.app"
          test -d "$APP_PATH"
          rm -rf Payload Studix.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Studix-unsigned.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studix-unsigned-${{ github.run_number }}
          path: Studix-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Studix build ${{ github.run_number }}
          files: Studix-unsigned.ipa
          generate_release_notes: true
