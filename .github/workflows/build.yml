name: Build
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare icon
        run: |
          D=Sources/Assets.xcassets/AppIcon.appiconset
          mkdir -p $D
          [ -f $D/Contents.json ] || echo '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > $D/Contents.json
          [ -f Sources/Assets.xcassets/Contents.json ] || echo '{"info":{"author":"xcode","version":1}}' > Sources/Assets.xcassets/Contents.json
          [ -f $D/icon.png ] || python3 - <<'PY'
          import zlib, struct
          n = 1024
          def row(y):
              return b'\x00' + bytes(c for x in range(n) for c in (30 + x * 50 // n, 90 + y * 60 // n, 230 - y * 60 // n))
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d))
          raw = b''.join(row(y) for y in range(n))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', n, n, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('Sources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb').write(png)
          PY

      - name: Check icons
        run: |
          D=Sources/Assets.xcassets/AppIcon.appiconset
          ls -la $D
          cat $D/Contents.json
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          D = 'Sources/Assets.xcassets/AppIcon.appiconset'
          for name in ['icon.png', 'icon-dark.png']:
              path = f'{D}/{name}'
              if not os.path.exists(path):
                  print('MISSING', name)
                  continue
              image = Image.open(path)
              print(name, image.size, image.mode)
              changed = False
              if image.size != (1024, 1024):
                  image = image.convert('RGBA').resize((1024, 1024), Image.LANCZOS)
                  changed = True
              if name == 'icon.png' and ('A' in image.mode or image.mode == 'P'):
                  image = image.convert('RGBA')
                  flat = Image.new('RGBA', image.size, (255, 255, 255, 255))
                  flat.alpha_composite(image)
                  image = flat.convert('RGB')
                  changed = True
              if changed:
                  image.save(path)
                  print('fixed', name)
          PY

      - name: Prepare logo and strings
        run: |
          D=Sources/Assets.xcassets/AppIcon.appiconset
          if [ -f $D/xlogo.png ]; then
            mkdir -p Sources/Assets.xcassets/XLogo.imageset
            mv $D/xlogo.png Sources/Assets.xcassets/XLogo.imageset/xlogo.png
            echo '{"images":[{"filename":"xlogo.png","idiom":"universal"}],"info":{"author":"xcode","version":1},"properties":{"template-rendering-intent":"template"}}' > Sources/Assets.xcassets/XLogo.imageset/Contents.json
          fi
          mkdir -p Sources/ar.lproj
          sed -E 's/^("[^"]*") = .*$/\1 = \1;/' Sources/en.lproj/Localizable.strings > Sources/ar.lproj/Localizable.strings

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Studix.xcodeproj -scheme Studix -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -20; exit 1; }

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Studix.app Payload/
          zip -qr Studix.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Studix
          path: Studix.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Studix ${{ github.run_number }}
          files: Studix.ipa
