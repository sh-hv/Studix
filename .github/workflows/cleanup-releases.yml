name: Cleanup old releases

on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'How many of the newest releases to keep'
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete old releases and tags
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | tail -n +$((KEEP + 1)) \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
